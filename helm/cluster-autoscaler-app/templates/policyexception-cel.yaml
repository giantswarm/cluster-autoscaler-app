{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ include "cluster-autoscaler.fullname" . }}
  namespace: kube-system
  labels:
    {{- include "cluster-autoscaler.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  # check-resources-request-and-limits-ratio is a supplemental policy and usually
  # not enabled. It is excepted because the cluster-autoscaler Deployment fails it
  # when the policy is enforced.
  - name: check-resources-request-and-limits-ratio
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the cluster-autoscaler Deployment fails it when the policy is
  # enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the cluster-autoscaler ServiceAccount fails it
  # when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: cluster-autoscaler-workloads
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Deployment', 'ReplicaSet', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == '{{ include "cluster-autoscaler.fullname" . }}' || object.metadata.name.startsWith('{{ include "cluster-autoscaler.fullname" . }}-'))
{{- end }}
